<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screening desk bot (simulation)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2231%22%20fill%3D%22%23f4f0e6%22%2F%3E%3Cg%20transform%3D%22rotate%28-8%2032%2032%29%22%3E%0A%20%20%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2228.5%22%20fill%3D%22none%22%20stroke%3D%22%231b1915%22%20stroke-width%3D%223.6%22%2F%3E%0A%20%20%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2222.6%22%20fill%3D%22none%22%20stroke%3D%22%231b1915%22%20stroke-width%3D%221.3%22%20stroke-dasharray%3D%222.3%202.5%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M14%2039.5h36%22%20stroke%3D%22%231b1915%22%20stroke-width%3D%221.3%22%20opacity%3D%22.45%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M14%2045h36%22%20stroke%3D%22%231b1915%22%20stroke-width%3D%221.3%22%20opacity%3D%22.3%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M19.5%2031.5%2028%2040%2045.5%2021%22%20fill%3D%22none%22%20stroke%3D%22%231d6a48%22%20stroke-width%3D%225.6%22%20stroke-linecap%3D%22square%22%20stroke-linejoin%3D%22miter%22%2F%3E%0A%20%20%3C%2Fg%3E%3C%2Fsvg%3E">
<!-- Scripted simulation for the demo video: shows how a chat bot such as Grok works once it is connected to the desk.
     The wording is scripted and no model is called. Every number, verdict, reason and ID is fetched live from the
     desk through its MCP connector (/mcp), with the same tool calls a connected agent would make.
     Adapted from the bot mock in our Track 2 entry (ddhack-track2-screening-same-entity, demo/bot.html).
     Keys: Space pauses or resumes, R restarts. Add ?step to advance one beat per Space press. -->
<style>
  :root { --bg: #0e0e0f; --rail: #0b0b0c; --bubble: #18181a; --line: rgba(255,255,255,.07); --ink: #ececee; --soft: #8d8d92; --faint: #5e5e63; --blue: #2f7df6; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.44 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; display: flex; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  .rail { width: 78px; flex: none; background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; position: relative; }
  .lights { position: absolute; left: 11px; top: 12px; display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; }
  .rail .home { margin-top: 48px; position: relative; width: 38px; height: 38px; }
  .rail .home::after { content: ""; position: absolute; right: 0; bottom: 2px; width: 9px; height: 9px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 2px var(--rail); }
  .rail hr { width: 52px; border: 0; border-top: 1px solid var(--line); margin: 16px 0 14px; }
  .bots { display: flex; flex-direction: column; gap: 4px; }
  .bots div { width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; }
  .bots div.on { background: #1d1d20; }
  .bots svg, .home svg { width: 38px; height: 38px; display: block; }
  .rail .end { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 15px; padding-bottom: 12px; color: var(--soft); }
  .rail .me { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #8c8a72, #3c3d33 70%); }

  main { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; }
  .title { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); z-index: 3; display: flex; align-items: center; gap: 9px; height: 38px; padding: 0 14px 0 10px; border-radius: 19px; background: #1b1b1d; border: 1px solid var(--line); font-weight: 500; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
  .title svg { width: 24px; height: 24px; }
  .share { position: absolute; top: 8px; right: 12px; z-index: 3; height: 34px; padding: 0 16px; border-radius: 17px; background: #19191b; border: 1px solid var(--line); font-weight: 500; font-size: 14px; }
  #thread { flex: 1; overflow-y: auto; padding: 58px 17px 14px; scrollbar-width: none; }
  #thread::-webkit-scrollbar { display: none; }
  .stamp { text-align: center; color: var(--soft); font-size: 12.5px; margin: 22px 0 16px; }
  .row { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 10px; }
  .row.me { justify-content: flex-end; }
  .bubble { max-width: min(541px, 82%); background: var(--bubble); border: 1px solid rgba(255,255,255,.045); border-radius: 22px; padding: 14px 12px 15px; animation: in .28s cubic-bezier(.2,0,0,1); }
  .me .bubble { background: #26262a; padding: 10px 15px; border-radius: 20px; }
  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child { margin: 0; }
  .bubble a { color: inherit; text-decoration: underline; text-decoration-color: rgba(255,255,255,.35); text-underline-offset: 3px; }
  .bubble b { font-weight: 600; }
  .acts { display: flex; gap: 12px; color: var(--soft); opacity: 0; padding-bottom: 14px; transition: opacity .15s; }
  .row:hover .acts { opacity: 1; }
  .wake { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--soft); font-size: 12.5px; margin: 0 0 14px; animation: in .28s cubic-bezier(.2,0,0,1); }
  .wake i { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
  .dots { display: flex; gap: 5px; padding: 5px 4px 4px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #77777c; animation: d 1.1s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes d { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .w { opacity: 0; animation: w .25s forwards; }
  @keyframes w { to { opacity: 1; } }

  main::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 64px; z-index: 2; pointer-events: none; background: linear-gradient(var(--bg) 62%, rgba(14,14,15,0)); }
  .sim { position: absolute; top: 14px; left: 18px; z-index: 3; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 3px 10px; background: #151517; }
  .card { margin: 4px auto 18px; max-width: 520px; background: #151517; border: 1px solid rgba(255,255,255,.09); border-radius: 18px; padding: 14px 16px; animation: in .28s cubic-bezier(.2,0,0,1); }
  .card h4 { margin: 0 0 3px; font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card h4 i { width: 8px; height: 8px; border-radius: 50%; background: #e0a43a; }
  .card.ok h4 i { background: #2fbf71; }
  .card .url { color: var(--soft); font: 12.5px ui-monospace, "SF Mono", Menlo, monospace; }
  .card .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .card .tools span { font: 12px ui-monospace, "SF Mono", Menlo, monospace; color: #c9c9ce; background: #202023; border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; animation: in .25s both; }
  .call { display: flex; align-items: center; gap: 8px; margin: 0 0 8px 4px; color: var(--faint); font: 12px ui-monospace, "SF Mono", Menlo, monospace; animation: in .25s cubic-bezier(.2,0,0,1); }
  .call b { color: #9db8ee; font-weight: 500; }
  .call svg { flex: none; }
  .composer { margin: 0 15px 10px 17px; height: 42px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 7px; border-radius: 21px; background: #161617; border: 1px solid rgba(255,255,255,.085); }
  .composer .plus { width: 28px; height: 28px; border-radius: 50%; background: #242427; display: grid; place-items: center; color: #b9b9be; }
  .composer input { flex: 1; background: none; border: 0; outline: 0; color: var(--ink); font: inherit; }
  .composer input::placeholder { color: #6c6c71; }
  .composer .mic { color: #a8a8ad; display: grid; place-items: center; width: 28px; }
  .composer .wave { width: 28px; height: 28px; border-radius: 50%; background: var(--blue); display: flex; align-items: center; justify-content: center; gap: 2px; }
  .composer .wave i { width: 2px; border-radius: 2px; background: #fff; }
</style>
</head>
<body>
<aside class="rail">
  <div class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
  <div class="home" id="home"></div>
  <hr>
  <div class="bots" id="bots"></div>
  <div class="end">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9 2.5v13M2.5 9h13"/></svg>
    <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="5.5" height="5.5" rx="1"/><rect x="10.5" y="2" width="5.5" height="5.5" rx="1"/><rect x="2" y="10.5" width="5.5" height="5.5" rx="1"/><path d="M13.25 10.5v5.5M10.5 13.25H16"/></svg>
    <div class="me"></div>
  </div>
</aside>
<main>
  <div class="sim">Simulation · live data over MCP</div>
  <div class="title"><span id="mark"></span>Screening desk</div>
  <button class="share">Share</button>
  <div id="thread"></div>
  <form class="composer" id="form">
    <span class="plus"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 1.5v11M1.5 7h11"/></svg></span>
    <input id="in" placeholder="Message Screening desk" autocomplete="off">
    <span class="mic"><svg width="16" height="18" viewBox="0 0 16 18" fill="currentColor"><rect x="5" y="1" width="6" height="10" rx="3"/><path d="M2.5 8.5a5.5 5.5 0 0 0 11 0M8 14v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
    <span class="wave"><i style="height:6px"></i><i style="height:12px"></i><i style="height:15px"></i><i style="height:9px"></i><i style="height:12px"></i><i style="height:5px"></i></span>
  </form>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const STEP = new URLSearchParams(location.search).has("step");
const DEMO = new URLSearchParams(location.search).has("demo");   // for the recorded video: no label
if (DEMO) document.querySelector(".sim").remove();
let paused = false, waiting = null, run = 0;
window.botIdle = false;

// Blob avatars: a soft shape with two eyes.
const EYES = '<g fill="#1a1a1c" transform="rotate(14 27 15)"><rect x="21.5" y="10.5" width="3.6" height="8" rx="1.8"/><rect x="28.2" y="10.5" width="3.6" height="8" rx="1.8"/></g>';
const SHAPES = {
  round: '<circle cx="20" cy="20" r="17"/>',
  octagon: '<path d="M14.2 3.6h11.6a3 3 0 0 1 2.1.9l7.6 7.6a3 3 0 0 1 .9 2.1v11.6a3 3 0 0 1-.9 2.1l-7.6 7.6a3 3 0 0 1-2.1.9H14.2a3 3 0 0 1-2.1-.9l-7.6-7.6a3 3 0 0 1-.9-2.1V14.2a3 3 0 0 1 .9-2.1l7.6-7.6a3 3 0 0 1 2.1-.9Z"/>',
  square: '<rect x="5" y="6" width="30" height="28" rx="7" transform="rotate(-12 20 20)"/>',
  bean: '<ellipse cx="20" cy="21" rx="17.5" ry="13" transform="rotate(-8 20 20)"/>',
  pill: '<rect x="2.5" y="8" width="35" height="24" rx="12" transform="rotate(-8 20 20)"/>',
  hex: '<path d="M16.5 4.2a7 7 0 0 1 7 0l9 5.2a7 7 0 0 1 3.5 6.1v9a7 7 0 0 1-3.5 6.100l-9 5.2a7 7 0 0 1-7 0l-9-5.2A7 7 0 0 1 4 24.500v-9a7 7 0 0 1 3.5-6.100Z"/>',
};
const blob = (shape, color) => `<svg viewBox="0 0 40 40"><g fill="${color}">${SHAPES[shape]}</g>${EYES}</svg>`;
$("#home").innerHTML = blob("round", "#f4f4f5");
$("#bots").innerHTML = [["octagon", "#ff5a4f", 1], ["square", "#ff9f1a"], ["bean", "#b0713a"], ["pill", "#8a4dff"], ["hex", "#17b8a6"]].map(([s, c, on]) => `<div class="${on ? "on" : ""}">${blob(s, c)}</div>`).join("");
$("#mark").innerHTML = '<svg viewBox="0 0 64 64" aria-hidden="true" style="width:24px;height:24px"><g transform="rotate(-8 32 32)">\n    <circle cx="32" cy="32" r="28.5" fill="none" stroke="#ececee" stroke-width="3.6"/>\n    <circle cx="32" cy="32" r="22.6" fill="none" stroke="#ececee" stroke-width="1.3" stroke-dasharray="2.3 2.5"/>\n    <path d="M14 39.5h36" stroke="#ececee" stroke-width="1.3" opacity=".45"/>\n    <path d="M14 45h36" stroke="#ececee" stroke-width="1.3" opacity=".3"/>\n    <path d="M19.5 31.5 28 40 45.5 21" fill="none" stroke="#3ccf8e" stroke-width="5.6" stroke-linecap="square" stroke-linejoin="miter"/>\n  </g></svg>';

const thread = $("#thread");
const bottom = () => (thread.scrollTop = thread.scrollHeight);
// pause: a timed wait. beat: the end of a scene; with ?step it waits for Space so a recording can set the pace.
async function pause(ms, me) {
  await new Promise((r) => setTimeout(r, ms));
  while (paused && me === run) await new Promise((r) => setTimeout(r, 120));
  if (me !== run) throw "restart";
}
async function beat(ms, me) {
  window.botIdle = true;
  if (STEP) await new Promise((r) => (waiting = r)); else await pause(ms, me);
  window.botIdle = false;
  if (me !== run) throw "restart";
}
const stamp = (t) => { thread.insertAdjacentHTML("beforeend", `<div class="stamp">${esc(t)}</div>`); bottom(); };
const wake = (t) => { thread.insertAdjacentHTML("beforeend", `<div class="wake"><i></i>${esc(t)}</div>`); bottom(); };
const ACTS = '<div class="acts"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="6.3"/><path d="M5.6 9.6a3 3 0 0 0 4.8 0M6 6.4h.01M10 6.400h.01" stroke-linecap="round"/></svg><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.500 2.500 7 6 10.500M2.800 7h6.700a4 4 0 0 1 4 4v1.500"/></svg><svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.2"/><circle cx="8" cy="8" r="1.2"/><circle cx="13" cy="8" r="1.2"/></svg></div>';
async function say(paras, me) {
  const row = document.createElement("div"); row.className = "row";
  row.innerHTML = `<div class="bubble"><div class="dots"><i></i><i></i><i></i></div></div>${ACTS}`;
  thread.appendChild(row); bottom();
  await pause(1000, me);
  const bubble = row.querySelector(".bubble"); bubble.innerHTML = "";
  for (const html of paras) {
    const p = document.createElement("p"); bubble.appendChild(p);
    const parts = html.split(/(<[^>]+>|\s+)/).filter((x) => x !== "");   // reveal word by word, keeping tags whole
    let open = "", built = "";
    for (const part of parts) {
      if (part.startsWith("<")) { built += part; open = part.startsWith("</") ? "" : part; continue; }
      built += /^\s+$/.test(part) ? part : `<span class="w">${part}</span>`;
      p.innerHTML = built + (open ? "</" + open.slice(1).split(/[ >]/)[0] + ">" : "");
      if (!/^\s+$/.test(part)) { bottom(); await pause(22, me); }
    }
    p.innerHTML = html;
  }
  bottom();
}
async function user(text, me) {
  const input = $("#in");
  for (let i = 1; i <= text.length; i++) { input.value = text.slice(0, i); await pause(30, me); }
  await pause(400, me);
  input.value = "";
  thread.insertAdjacentHTML("beforeend", `<div class="row me"><div class="bubble">${esc(text)}</div></div>`); bottom();
}

// ---- the connector: the same JSON-RPC calls a connected agent makes
let rpcId = 0;
async function rpc(method, params) {
  const res = await fetch("/mcp", { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json, text/event-stream" },
    body: JSON.stringify({ jsonrpc: "2.0", id: ++rpcId, method, params: params || {} }) });
  return (await res.json()).result;
}
const GEAR = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M9.5 2.500a3.500 3.500 0 0 0 4 4L8 12l-4 1.500L5.500 9.500z"/></svg>';
async function tool(name, args, summary, me) {
  const out = JSON.parse((await rpc("tools/call", { name, arguments: args })).content[0].text);
  await pause(350, me);
  return out;
}
const money = (n) => "£" + Number(n).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const link = (inst, id) => `<a href="/#${esc(inst)}/${esc(id)}" target="_blank">${esc(id)}</a>`;
const firstSentences = (text, n) => text.split(/(?<=[.!?])\s+(?=[A-Z£])/).slice(0, n).join(" ").trim();
const INST = "bank", INST_NAME = "bank";

async function play() {
  const me = ++run;
  thread.innerHTML = ""; $("#in").value = ""; window.botIdle = false;
  try {
    // Scene 1: the bot is given the desk's connector and discovers its tools.
    thread.insertAdjacentHTML("beforeend", `<div class="card" id="card"><h4><i></i>Connecting to Screening desk…</h4><div class="url">MCP connector · ${esc(location.origin)}/mcp</div><div class="tools" id="tools"></div></div>`);
    await pause(900, me);
    await rpc("initialize", { protocolVersion: "2025-06-18", capabilities: {}, clientInfo: { name: "bot (simulation)", version: "1" } });
    const listed = (await rpc("tools/list")).tools;
    $("#card").classList.add("ok");
    $("#card h4").innerHTML = `<i></i>Screening desk connected · ${listed.length} tools, all read-only`;
    for (const t of listed) { $("#tools").insertAdjacentHTML("beforeend", `<span>${esc(t.name)}</span>`); await pause(170, me); }
    await beat(2200, me);

    // Scene 2: the overnight queue.
    stamp("Today 7:00 AM");
    const q = await tool("queue_overview", { institution: INST }, (o) => `${o.cases.toLocaleString()} cases`, me);
    const v = q.by_verdict;
    await say([
      `Morning. I went through the ${INST_NAME}'s queue while you were out: ${q.cases.toLocaleString()} cases.`,
      `<b>${v.CLOSE}</b> are closed, each citing the document that explains it. <b>${v.RFI}</b> need one document from the customer, and I've drafted each request. <b>${v.ESCALATE}</b> are with the MLRO.`,
      `I'll wake up when a new alert lands.`,
    ], me);
    await beat(2600, me);

    // Scene 3: a new alert that must not be closed.
    stamp("Today 2:14 PM");
    wake("Woke on a new monitoring alert");
    const found = await tool("search_cases", { institution: INST, verdict: "ESCALATE", rule: "TM22", limit: 1 }, (o) => `${o.matches} matching, opening the newest`, me);
    const esc1 = await tool("screen_case", { institution: INST, case_id: found.cases[0].case_id }, (o) => `${o.decision.verdict} · ${o.decision.reason_code}`, me);
    const invoice = esc1.checks_that_found_something.find((c) => c.outcome === "explanation");
    await say([
      `A new alert just landed, so I ran it. <b>${esc(esc1.customer.name)}</b> (${link(INST, esc1.case.id)}). ${esc(firstSentences(esc1.alerts[0].message, 1))}`,
      `This one goes to the MLRO (<b>${esc(esc1.decision.reason_code)}</b>): the listed person still controlled the company when the payment was made.`,
      `${invoice ? "There is an invoice on file that matches the payment to the penny, and it does not clear the match. " : ""}I've drafted the referral, and I have <b>not</b> contacted the customer.`,
    ], me);
    await beat(2600, me);

    // Scene 4: the analyst pushes back.
    await user("Why not just close it? The invoice matches.", me);
    await pause(450, me);
    const file = await tool("get_case_file", { institution: INST, case_id: esc1.case.id }, (o) => `${o.documents.length} documents, ${o.transactions.length} transactions`, me);
    const entry = file.internal_list_entries[0] || {};
    await say([
      `Because the invoice explains what was bought, not who was paid. The list entry says: "${esc(entry.reason || "do not deal with this party")}"`,
      `The register documents on file (${esc(esc1.decision.evidence.filter((e) => /^(PSC|REG)-/.test(e)).join(", "))}) show that person still controlled the company on the day of the payment.`,
      `I don't decide these myself. The desk's rules do, so the same case gets the same answer every time, and anything they can't explain goes to a person instead of being closed.`,
    ], me);
    await beat(2600, me);

    // Scene 5: a case that needs one document.
    stamp("Today 3:02 PM");
    wake("Woke on a new monitoring alert");
    const more = await tool("search_cases", { institution: INST, verdict: "RFI", reason_code: "RFI_SOURCE_OF_FUNDS", limit: 1 }, (o) => `${o.matches} matching, opening the newest`, me);
    const rfi = await tool("screen_case", { institution: INST, case_id: more.cases[0].case_id }, (o) => `${o.decision.verdict} · ${o.decision.reason_code}`, me);
    const ask = (rfi.next_step.text.match(/Please send us ([^]+?)\.\n/) || [])[1] || "the document that shows where the money came from";
    await say([
      `I need one thing from the customer on this one. <b>${esc(rfi.customer.name)}</b> (${link(INST, rfi.case.id)}): ${esc(firstSentences(rfi.alerts[0].message, 1))}`,
      `Nothing about it looks criminal, and nothing on file explains it. What would settle it: ${esc(ask)}.`,
      `The request is drafted and says nothing about monitoring. <a href="/#${esc(INST)}/${esc(rfi.case.id)}" target="_blank">Open it in the desk</a>.`,
    ], me);
    window.botIdle = true;
  } catch (e) { if (e !== "restart") { console.error(e); window.botIdle = true; } }
}
document.addEventListener("keydown", (e) => {
  if (e.target === $("#in") && e.key !== "Escape") return;
  if (e.key === " ") { e.preventDefault(); if (waiting) { const w = waiting; waiting = null; w(); } else paused = !paused; }
  if (e.key.toLowerCase() === "r") play();
});
$("#form").addEventListener("submit", (e) => e.preventDefault());
play();
</script>
