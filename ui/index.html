<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screening desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2231%22%20fill%3D%22%23f4f0e6%22%2F%3E%3Cg%20transform%3D%22rotate%28-8%2032%2032%29%22%3E%0A%20%20%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2228.5%22%20fill%3D%22none%22%20stroke%3D%22%231b1915%22%20stroke-width%3D%223.6%22%2F%3E%0A%20%20%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2222.6%22%20fill%3D%22none%22%20stroke%3D%22%231b1915%22%20stroke-width%3D%221.3%22%20stroke-dasharray%3D%222.3%202.5%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M14%2039.5h36%22%20stroke%3D%22%231b1915%22%20stroke-width%3D%221.3%22%20opacity%3D%22.45%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M14%2045h36%22%20stroke%3D%22%231b1915%22%20stroke-width%3D%221.3%22%20opacity%3D%22.3%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M19.5%2031.5%2028%2040%2045.5%2021%22%20fill%3D%22none%22%20stroke%3D%22%231d6a48%22%20stroke-width%3D%225.6%22%20stroke-linecap%3D%22square%22%20stroke-linejoin%3D%22miter%22%2F%3E%0A%20%20%3C%2Fg%3E%3C%2Fsvg%3E">
<style>
:root {
  --paper: #f4f0e6;
  --paper-deep: #ebe5d6;
  --sheet: #fbf9f3;
  --ink: #1b1915;
  --ink-soft: #57514a;
  --ink-faint: #8d8578;
  --rule: #d3cbb9;
  --rule-soft: #e3dccd;
  --close: #1d6a48;
  --close-wash: #dfeee4;
  --rfi: #9a5b06;
  --rfi-wash: #f6e9cf;
  --esc: #a1261d;
  --esc-wash: #f5dcd7;
  --mark: #2b4a7a;
  --serif: "Iowan Old Style", "Charter", "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --sans: "Avenir Next", "Segoe UI Variable Text", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  /* type scale: interface text uses these five steps only */
  --fs-xs: 11px;    /* labels, tags, IDs */
  --fs-sm: 12.5px;  /* secondary text, notes */
  --fs-md: 14px;    /* body text */
  --fs-lg: 17px;    /* lead lines, quotes */
  --fs-xl: 22px;    /* section headings */
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); font: var(--fs-md)/1.5 var(--sans);
  background:
    repeating-linear-gradient(0deg, transparent 0 27px, rgba(120,105,80,.045) 27px 28px),
    radial-gradient(1200px 600px at 85% -10%, #fffdf6 0%, transparent 60%),
    var(--paper);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: .9em; letter-spacing: -.01em; }
/* figures line up in columns of money and counts */
.tx-amt, .n, .chip b, .tally b, .big b, .dd-n, .fact div:last-child, .over td { font-variant-numeric: tabular-nums lining-nums; }
.label { font-feature-settings: "case" 1; }
.label { font-size: var(--fs-xs); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; }

/* ---------- frame ---------- */
.desk { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
.mast {
  display: flex; align-items: flex-end; gap: 28px; padding: 14px 22px 0; border-bottom: 2px solid var(--ink);
  background: linear-gradient(180deg, rgba(255,255,255,.5), transparent);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 26px; font-style: italic; letter-spacing: -.015em; padding-bottom: 8px; white-space: nowrap; }
.brand b { font-style: normal; font-weight: 600; letter-spacing: -.02em; }
.brand .logo { display: block; width: 34px; height: 34px; } .brand .logo svg { display: block; width: 100%; height: 100%; }
.tabs { display: flex; gap: 2px; align-self: flex-end; }
.tab {
  border: 1px solid transparent; border-bottom: 0; background: none; padding: 8px 14px 9px; font-size: var(--fs-sm); color: var(--ink-soft);
  border-radius: 3px 3px 0 0; position: relative; top: 2px;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 600; }
.tally { margin-left: auto; padding-bottom: 10px; color: var(--ink-soft); font-size: var(--fs-sm); white-space: nowrap; }
.tally b { color: var(--ink); font-family: var(--mono); font-weight: 500; }
.panes { display: grid; grid-template-columns: 318px minmax(440px, 1fr) minmax(360px, 34vw); min-height: 0; }
.pane { min-height: 0; overflow: auto; }

/* ---------- queue ---------- */
.queue { border-right: 1px solid var(--rule); background: rgba(255,255,255,.28); display: flex; flex-direction: column; overflow: visible; position: relative; z-index: 5; }
.queue-tools { padding: 14px 14px 10px; border-bottom: 1px solid var(--rule); }
.search { width: 100%; border: 1px solid var(--rule); background: var(--sheet); padding: 7px 10px; border-radius: 2px; }
.filters { display: flex; gap: 5px; margin-top: 9px; flex-wrap: nowrap; }
.chip {
  border: 1px solid var(--rule); background: var(--sheet); padding: 3px 8px; border-radius: 99px; font-size: 12px; color: var(--ink-soft); white-space: nowrap;
  display: inline-flex; gap: 6px; align-items: center;
}
.chip b { font-family: var(--mono); font-weight: 500; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip[aria-pressed="true"] b { color: var(--paper); }
.chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.field { display: block; margin-top: 11px; }
.field .label { display: block; margin-bottom: 4px; }
.dd { position: relative; }
.dd-btn {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; height: 34px; padding: 0 11px 0 10px; text-align: left;
  border: 1px solid var(--rule); border-radius: 2px; background: var(--sheet); color: var(--ink); font: 400 var(--fs-sm)/1 var(--sans);
}
.dd-btn:hover, .dd-btn[aria-expanded="true"] { border-color: var(--ink); }
.dd-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-btn svg { flex: none; transition: transform .15s ease; }
.dd-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.dd-list {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; min-width: 100%; width: max-content; max-width: 430px; max-height: 60vh; overflow: auto;
  margin: 0; padding: 4px; list-style: none; background: var(--sheet); border: 1px solid var(--ink); border-radius: 2px;
  box-shadow: 0 14px 30px -12px rgba(40,30,10,.45);
}
.dd-list[hidden] { display: none; }
.dd-opt {
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 2px; cursor: pointer;
  font: 400 var(--fs-sm)/1.3 var(--sans); color: var(--ink);
}
.dd-opt:hover, .dd-opt.active { background: var(--paper-deep); }
.dd-opt[aria-selected="true"] { font-weight: 600; }
.dd-opt[aria-selected="true"] .dd-n { color: var(--ink); }
.dd-code { font: 500 var(--fs-xs)/1.5 var(--mono); border: 1px solid var(--rule); border-radius: 2px; text-align: center; color: var(--ink-soft); background: var(--paper); }
.dd-n { font: 400 var(--fs-sm) var(--mono); color: var(--ink-faint); }
.search { height: 34px; font: 400 var(--fs-sm) var(--sans); }
.queue-list { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; min-height: 0; }
.q {
  display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--rule-soft); cursor: pointer;
  border-left: 3px solid transparent;
}
.q:hover { background: rgba(255,255,255,.55); }
.q[aria-current="true"] { background: var(--sheet); border-left-color: var(--ink); }
.glyph {
  width: 24px; height: 24px; display: grid; place-items: center; font: 600 var(--fs-xs) var(--mono); border: 1.5px solid currentColor; border-radius: 2px; margin-top: 2px;
}
.v-CLOSE { color: var(--close); } .v-RFI { color: var(--rfi); } .v-ESCALATE { color: var(--esc); }
.bg-CLOSE { background: var(--close); } .bg-RFI { background: var(--rfi); } .bg-ESCALATE { background: var(--esc); }
.q-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-meta { display: flex; gap: 6px; align-items: center; color: var(--ink-faint); font-size: var(--fs-xs); }
.rule-tag { font: 500 var(--fs-xs) var(--mono); border: 1px solid var(--rule); padding: 0 4px; border-radius: 2px; color: var(--ink-soft); background: var(--sheet); }
.queue-foot { padding: 7px 14px; border-top: 1px solid var(--rule); font-size: var(--fs-xs); color: var(--ink-faint); }
kbd { font: var(--fs-xs) var(--mono); border: 1px solid var(--rule); border-bottom-width: 2px; padding: 0 4px; border-radius: 3px; background: var(--sheet); }

/* ---------- process ---------- */
.process { padding: 26px 34px 80px; }
.empty { color: var(--ink-faint); font-family: var(--serif); font-style: italic; font-size: var(--fs-lg); padding: 80px 20px; text-align: center; }
.case-head { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: end; border-bottom: 1px solid var(--ink); padding-bottom: 14px; }
.case-head h1 { font-family: var(--serif); font-weight: 500; font-size: 36px; line-height: 1.05; margin: 4px 0 6px; letter-spacing: -.02em; }
.case-sub { color: var(--ink-soft); }
.controls { display: flex; gap: 8px; }
.btn { border: 1px solid var(--ink); background: none; padding: 5px 12px; border-radius: 2px; font-size: var(--fs-sm); }
.btn:hover { background: var(--ink); color: var(--paper); }
.steps { list-style: none; margin: 22px 0 0; padding: 0; position: relative; }
.steps::before { content: ""; position: absolute; left: 15px; top: 8px; bottom: 30px; width: 1px; background: var(--rule); }
.step { position: relative; padding: 0 0 26px 52px; opacity: 0; transform: translateY(10px); transition: opacity .38s ease, transform .38s ease; }
.step.on { opacity: 1; transform: none; }
.step-no {
  position: absolute; left: 0; top: 0; width: 31px; height: 31px; border-radius: 50%; border: 1px solid var(--ink); background: var(--paper);
  display: grid; place-items: center; font: 500 var(--fs-sm) var(--mono);
}
.step.on .step-no { background: var(--ink); color: var(--paper); }
.step h2 { font-family: var(--serif); font-weight: 500; font-size: var(--fs-xl); margin: 0 0 2px; padding-top: 2px; letter-spacing: -.005em; }
.step-lede { color: var(--ink-soft); margin: 0 0 10px; max-width: 70ch; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 2px; box-shadow: 0 1px 0 rgba(0,0,0,.03), 0 8px 18px -14px rgba(60,45,20,.35); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0; }
.fact { padding: 10px 14px; border-right: 1px solid var(--rule-soft); border-bottom: 1px solid var(--rule-soft); overflow-wrap: anywhere; min-width: 0; }
.fact div:last-child { margin-top: 2px; }
.alert-card { padding: 11px 14px; border-left: 3px solid var(--ink); margin-bottom: 8px; }
.alert-card .rule-tag { font-size: var(--fs-xs); padding: 1px 6px; background: var(--ink); color: var(--paper); border-color: var(--ink); }
.alert-card h3 { display: inline; font-size: var(--fs-md); margin: 0 0 0 8px; font-weight: 600; }
.alert-card p { margin: 5px 0 0; color: var(--ink-soft); }
.policy { margin: 0; display: grid; grid-template-columns: minmax(180px, 34%) 1fr; }
.policy dt, .policy dd { margin: 0; padding: 7px 14px; border-bottom: 1px solid var(--rule-soft); }
.policy dt { color: var(--ink-soft); }
.check { padding: 12px 14px 12px 16px; margin-bottom: 8px; border-left: 3px solid var(--rule); }
.check.explanation { border-left-color: var(--close); }
.check.suspicion { border-left-color: var(--esc); background: linear-gradient(90deg, var(--esc-wash), var(--sheet) 42%); }
.check.block { border-left-color: var(--rfi); }
.check-top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.check-top h3 { margin: 0; font-size: var(--fs-md); font-weight: 600; }
.outcome { font-size: var(--fs-xs); letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
.outcome.explanation { color: var(--close); } .outcome.suspicion { color: var(--esc); } .outcome.block { color: var(--rfi); }
.check-q { color: var(--ink-faint); font-size: var(--fs-sm); font-style: italic; margin: 1px 0 6px; }
.check p { margin: 6px 0; max-width: 78ch; }
.code { font: 500 var(--fs-xs) var(--mono); padding: 1px 6px; border-radius: 2px; border: 1px solid currentColor; }
.ev { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.ev button {
  font: 500 var(--fs-xs) var(--mono); border: 1px solid var(--rule); background: var(--paper); padding: 1px 7px; border-radius: 2px; color: var(--mark);
}
.ev button:hover { background: var(--mark); color: #fff; border-color: var(--mark); }
details.quiet { margin-top: 4px; }
details.quiet summary { color: var(--ink-faint); font-size: var(--fs-sm); cursor: pointer; padding: 4px 0; }
details.quiet ul { margin: 4px 0 0; padding: 0 0 0 18px; color: var(--ink-soft); font-size: var(--fs-sm); columns: 2; column-gap: 28px; }
details.quiet li { break-inside: avoid; margin-bottom: 3px; }
.test { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--rule-soft); }
.test:last-child { border-bottom: 0; }
.tick { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: var(--fs-sm); color: #fff; }
.tick.yes { background: var(--close); } .tick.no { background: none; border: 1.5px solid var(--rfi); color: var(--rfi); }
.test small { color: var(--ink-soft); display: block; }
.verdict { padding: 22px 24px 20px; overflow: hidden; }
.verdict::after { content: ""; display: block; clear: both; }
.stamp {
  font: 700 26px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; padding: 13px 16px 11px; border: 3px double currentColor; border-radius: 4px;
  transform: rotate(-5deg) scale(1.9); opacity: 0; transition: transform .42s cubic-bezier(.2,1.5,.4,1), opacity .2s ease .05s; text-align: center;
  mix-blend-mode: multiply; float: right; margin: 2px 4px 14px 26px;
}
.step.on .stamp { transform: rotate(-5deg) scale(1); opacity: .92; }
.stamp small { display: block; font: 500 var(--fs-xs) var(--mono); letter-spacing: .04em; margin-top: 7px; }
.verdict-why { font-family: var(--serif); font-size: var(--fs-lg); font-style: italic; margin: 0 0 10px; }
.verdict p.reason { margin: 0 0 4px; }
.verdict .ev { clear: both; padding-top: 6px; }

.next { margin-top: 10px; padding: 16px 20px 18px; border-left: 3px solid var(--ink); }
.next h3 { margin: 0 0 2px; font: 600 var(--fs-md) var(--sans); }
.next .note { padding: 0; margin: 0 0 10px; color: var(--ink-soft); font-size: var(--fs-sm); }
.next pre { margin: 0; padding: 12px 14px; background: var(--paper); border: 1px dashed var(--rule); border-radius: 2px; white-space: pre-wrap; font: var(--fs-md)/1.55 var(--serif); max-height: 320px; overflow: auto; }
.next .btn { margin-top: 10px; }
.warn { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 12px; padding: 10px 12px; background: var(--esc-wash); border: 1px solid var(--esc); border-radius: 2px; color: #6e1711; font-weight: 600; }
.warn::before { content: "!"; flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--esc); color: #fff; display: grid; place-items: center; font: 700 var(--fs-sm) var(--mono); }
.sup { margin-top: 10px; padding: 16px 20px 18px; border-left: 3px solid var(--mark); }
.sup h3 { margin: 0 0 2px; font: 600 var(--fs-md) var(--sans); }
.sup h4 { margin: 14px 0 4px; font-size: var(--fs-xs); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
.sup ul { margin: 0; padding-left: 18px; } .sup li { margin: 3px 0; }
.sup .note { padding: 0; margin: 0 0 10px; color: var(--ink-soft); font-size: var(--fs-sm); }
.sup blockquote { margin: 0; padding: 12px 14px; background: var(--paper); border: 1px dashed var(--rule); border-radius: 2px; font: var(--fs-md)/1.55 var(--serif); }
.sup .pill { display: inline-block; font: 600 var(--fs-xs) var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; border: 1.5px solid currentColor; margin-right: 8px; }
.sup .lead { font: italic var(--fs-lg)/1.45 var(--serif); margin: 10px 0 0; }
.sup .busy { color: var(--ink-soft); font-style: italic; }
.entry { margin-top: 9px; padding: 9px 12px; background: var(--paper); border: 1px dashed var(--rule); border-radius: 2px; font-size: var(--fs-sm); }
.entry dl { margin: 4px 0 0; display: grid; grid-template-columns: 110px 1fr; gap: 2px 10px; }
.entry dt { color: var(--ink-faint); } .entry dd { margin: 0; }
.tab.over { margin-left: 14px; border: 1px solid var(--rule); border-bottom: 0; }
.tab.over + .tab.over { margin-left: 2px; }
.snippet { position: relative; margin: 8px 0 4px; padding: 13px 15px; background: var(--ink); color: #efe9dc; border-radius: 3px; font: var(--fs-sm)/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.snippet + .btn { margin-bottom: 6px; }
.conn ol { margin: 6px 0 0; padding-left: 20px; } .conn li { margin: 9px 0; }
.conn code { font: var(--fs-sm) var(--mono); background: var(--paper-deep); padding: 1px 5px; border-radius: 2px; }
.conn input.url { width: min(100%, 460px); border: 1px solid var(--rule); background: var(--sheet); padding: 6px 9px; border-radius: 2px; font: var(--fs-sm) var(--mono); }
.state { font: 600 var(--fs-xs) var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; border: 1.5px solid currentColor; }
.over-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 0 8px; }
.big { padding: 16px 18px; border-top: 3px solid currentColor; }
.big b { display: block; font: 500 40px/1 var(--serif); letter-spacing: -.02em; }
.big span { color: var(--ink-soft); font-size: var(--fs-sm); }
.bar { display: flex; height: 26px; border-radius: 2px; overflow: hidden; margin: 6px 0 4px; border: 1px solid var(--ink); }
.bar div { display: grid; place-items: center; color: #fff; font: 600 var(--fs-xs) var(--mono); }
.over h2 { font: 500 var(--fs-xl) var(--serif); margin: 26px 0 4px; }
.over table { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
.over th, .over td { text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--rule-soft); }
.over th { font-size: var(--fs-xs); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
.over td.n, .over th.n { text-align: right; font-family: var(--mono); }
.meter { height: 6px; background: var(--rule-soft); border-radius: 3px; overflow: hidden; min-width: 90px; }
.meter i { display: block; height: 100%; }
.assume { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--ink-soft); }
.assume input { width: 64px; border: 1px solid var(--rule); background: var(--sheet); padding: 3px 6px; border-radius: 2px; font: var(--fs-sm) var(--mono); }

/* ---------- file ---------- */
.file { border-left: 1px solid var(--rule); background: rgba(255,255,255,.28); display: flex; flex-direction: column; overflow: hidden; }
.file-tabs { display: flex; border-bottom: 1px solid var(--rule); padding: 0 10px; }
.file-tab { border: 0; background: none; padding: 12px 10px 10px; font-size: var(--fs-sm); color: var(--ink-soft); border-bottom: 2px solid transparent; }
.file-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.file-tab span { font-family: var(--mono); color: var(--ink-faint); font-weight: 400; }
.file-body { overflow: auto; flex: 1; padding: 12px 14px 60px; }
.tx { display: grid; grid-template-columns: 76px 1fr auto; gap: 10px; padding: 8px 8px; border-bottom: 1px solid var(--rule-soft); border-left: 3px solid transparent; }
.tx.flagged { background: var(--sheet); border-left-color: var(--ink); }
.tx.flash, .doc.flash { animation: flash 1.5s ease; }
@keyframes flash { 0%, 35% { background: #ffe9a8; } 100% { background: inherit; } }
.tx-date { color: var(--ink-faint); font: var(--fs-xs)/1.4 var(--mono); }
.tx-who { font-weight: 600; overflow-wrap: anywhere; }
.tx-ref { color: var(--ink-soft); font-size: var(--fs-sm); overflow-wrap: anywhere; }
.tx-amt { font: 500 var(--fs-sm) var(--mono); text-align: right; white-space: nowrap; }
.tx-amt.in { color: var(--close); } .tx-amt.out { color: var(--ink); }
.tx-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.tag { font-size: var(--fs-xs); padding: 0 5px; border-radius: 2px; border: 1px solid var(--rule); color: var(--ink-soft); }
.tag.ok { border-color: var(--close); color: var(--close); background: var(--close-wash); }
.tag.open { border-color: var(--rfi); color: var(--rfi); background: var(--rfi-wash); }
.tag.held { border-color: var(--esc); color: var(--esc); }
.doc { border: 1px solid var(--rule); background: var(--sheet); margin-bottom: 8px; border-radius: 2px; }
.doc summary { list-style: none; cursor: pointer; padding: 9px 12px; display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.doc summary::-webkit-details-marker { display: none; }
.doc-title { font-weight: 600; }
.doc-meta { color: var(--ink-faint); font-size: var(--fs-xs); }
.doc.relied { border-left: 3px solid var(--mark); }
.doc.baseline { opacity: .72; }
.doc-body { padding: 4px 14px 12px; border-top: 1px dashed var(--rule); font-family: var(--serif); font-size: var(--fs-md); line-height: 1.55; }
.doc-body h4 { font-size: var(--fs-lg); margin: 10px 0 6px; font-weight: 600; }
.doc-body p { margin: 6px 0; }
.doc-body table { border-collapse: collapse; width: 100%; font: var(--fs-sm) var(--sans); margin: 8px 0; }
.doc-body th, .doc-body td { border: 1px solid var(--rule); padding: 3px 7px; text-align: left; vertical-align: top; }
.doc-body th { background: var(--paper-deep); font-weight: 600; }
.chat { display: flex; flex-direction: column; height: calc(100% + 72px); margin: -12px -14px -60px; }
.chat { position: relative; }
.chat-bar { position: absolute; top: 8px; right: 12px; z-index: 3; display: flex; gap: 6px; }
.ibtn { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink-soft); font: italic 600 var(--fs-sm)/1 var(--serif); }
.ibtn:hover, .ibtn[aria-expanded="true"] { border-color: var(--ink); color: var(--ink); }
.chat-bar .btn { padding: 2px 9px; background: var(--sheet); font-size: var(--fs-sm); }
.chat-info { margin: 0 44px 4px 0; padding: 10px 12px; background: var(--paper); border: 1px dashed var(--rule); border-radius: 2px; color: var(--ink-soft); font-size: var(--fs-sm); }
.chat-info p { margin: 0 0 6px; } .chat-info p:last-child { margin: 0; }
.feed { margin: 8px 0 0; padding: 0; list-style: none; border: 1px solid var(--rule); background: var(--sheet); border-radius: 2px; max-height: 300px; overflow: auto; }
.feed li { display: grid; grid-template-columns: 70px 108px 1fr; gap: 10px; padding: 6px 12px; border-bottom: 1px solid var(--rule-soft); font: var(--fs-sm)/1.5 var(--mono); }
.feed li:last-child { border-bottom: 0; }
.feed .who { color: var(--mark); } .feed .here { color: var(--ink-faint); }
.feed li.new { animation: flash 1.6s ease; }
.checks { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 2px; }
.chat-log { flex: 1; overflow: auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 92%; }
.msg.user { align-self: flex-end; background: var(--ink); color: var(--paper); padding: 9px 13px; border-radius: 12px 12px 2px 12px; white-space: pre-wrap; }
.msg.bot { align-self: flex-start; background: var(--sheet); border: 1px solid var(--rule); padding: 11px 14px; border-radius: 2px 12px 12px 12px; box-shadow: 0 8px 18px -14px rgba(60,45,20,.35); }
.msg.bot p { margin: 0 0 8px; } .msg.bot p:last-child { margin-bottom: 0; }
.msg.bot ul, .msg.bot ol { margin: 4px 0 8px; padding-left: 20px; } .msg.bot li { margin: 3px 0; }
.msg.bot code { font: var(--fs-sm) var(--mono); background: var(--paper-deep); padding: 0 4px; border-radius: 2px; }
.msg.bot a.case { font: 500 var(--fs-sm) var(--mono); color: var(--mark); background: var(--paper); border: 1px solid var(--rule); padding: 0 5px; border-radius: 2px; text-decoration: none; cursor: pointer; white-space: nowrap; }
.msg.bot a.case:hover { background: var(--mark); color: #fff; border-color: var(--mark); }
.msg.err { align-self: flex-start; color: var(--esc); border: 1px solid var(--esc); background: var(--esc-wash); padding: 9px 13px; border-radius: 2px; }
.trail { display: flex; flex-direction: column; gap: 3px; margin: 0 0 9px; padding: 0 0 9px; border-bottom: 1px dashed var(--rule); }
.trail div { font: var(--fs-xs)/1.5 var(--mono); color: var(--ink-soft); }
.trail b { color: var(--mark); font-weight: 500; }
.trail .wait::after { content: " …"; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.chat-start { color: var(--ink-soft); }
.chat-start h3 { font: 500 var(--fs-xl) var(--serif); color: var(--ink); margin: 6px 0 4px; }
.sugg { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.sugg button { text-align: left; border: 1px solid var(--rule); background: var(--sheet); padding: 8px 11px; border-radius: 2px; font-size: var(--fs-sm); }
.sugg button:hover { border-color: var(--ink); }
.chat-box { display: flex; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid var(--rule); background: rgba(255,255,255,.5); }
.chat-box textarea { flex: 1; resize: none; height: 54px; border: 1px solid var(--rule); background: var(--sheet); padding: 8px 10px; border-radius: 2px; font: var(--fs-md)/1.4 var(--sans); color: var(--ink); }
.chat-box .btn { align-self: stretch; background: var(--ink); color: var(--paper); padding: 0 16px; }
.chat-box .btn:disabled { opacity: .45; cursor: default; }
.hist { border: 1px solid var(--rule); background: var(--sheet); padding: 10px 12px; margin-bottom: 8px; border-radius: 2px; }
.hist p { margin: 4px 0 0; color: var(--ink-soft); }
.note { color: var(--ink-faint); font-size: var(--fs-sm); padding: 8px 4px; }
.sub { margin: 16px 4px 4px; padding-bottom: 4px; border-bottom: 1px solid var(--ink); }
.error { color: var(--esc); padding: 20px; }

@media (max-width: 1180px) {
  .desk { height: auto; }
  .panes { grid-template-columns: 1fr; }
  .queue { max-height: 46vh; border-right: 0; border-bottom: 2px solid var(--ink); }
  .file { border-left: 0; border-top: 2px solid var(--ink); }
  .mast { flex-wrap: wrap; gap: 8px 20px; }
  .tally { margin-left: 0; }
  details.quiet ul { columns: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .step, .stamp { transition: none !important; }
}
</style>
</head>
<body>
<div class="desk">
  <header class="mast">
    <div class="brand"><span class="logo"><svg viewBox="0 0 64 64" aria-hidden="true"><g transform="rotate(-8 32 32)">
    <circle cx="32" cy="32" r="28.5" fill="none" stroke="#1b1915" stroke-width="3.6"/>
    <circle cx="32" cy="32" r="22.6" fill="none" stroke="#1b1915" stroke-width="1.3" stroke-dasharray="2.3 2.5"/>
    <path d="M14 39.5h36" stroke="#1b1915" stroke-width="1.3" opacity=".45"/>
    <path d="M14 45h36" stroke="#1b1915" stroke-width="1.3" opacity=".3"/>
    <path d="M19.5 31.5 28 40 45.5 21" fill="none" stroke="#1d6a48" stroke-width="5.6" stroke-linecap="square" stroke-linejoin="miter"/>
  </g></svg></span><span><b>Screening</b> desk</span></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Institution"></nav>
    <div class="tally" id="tally" aria-live="polite"></div>
  </header>
  <div class="panes">
    <aside class="pane queue" aria-label="Case queue">
      <div class="queue-tools">
        <input class="search" id="search" type="search" placeholder="Search case, customer or reason code" aria-label="Search cases">
        <div class="filters" id="filters"></div>
        <div class="field"><span class="label" id="ruleLabel">Rule that raised the alert</span>
          <div class="dd" id="ruleDD">
            <button class="dd-btn" id="ruleBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="ruleLabel ruleText">
              <span id="ruleText">All rules</span>
              <svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
            </button>
            <ul class="dd-list" id="ruleList" role="listbox" aria-labelledby="ruleLabel" tabindex="-1" hidden></ul>
          </div></div>
      </div>
      <ul class="queue-list" id="queue"></ul>
      <div class="queue-foot"><span id="shown"></span> · <kbd>J</kbd> <kbd>K</kbd> move · <kbd>R</kbd> replay</div>
    </aside>
    <main class="pane process" id="process"><div class="empty">Loading the queue…</div></main>
    <aside class="pane file" aria-label="Case file">
      <div class="file-tabs" role="tablist" id="fileTabs"></div>
      <div class="file-body" id="fileBody"></div>
    </aside>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const gbp = new Intl.NumberFormat("en-GB", { style: "currency", currency: "GBP" });
const NAMES = { bank: "Bank", emoney: "E-money", investment: "Investment", payments_fx: "Payments & FX" };
const VERDICTS = ["CLOSE", "RFI", "ESCALATE"];
const WHY = {
  CLOSE: "Every alert is explained and nothing points to crime.",
  RFI: "Nothing points to crime, but the file does not explain every alert.",
  ESCALATE: "A sign of crime was found, so the case goes to the MLRO.",
};
const state = { inst: null, cases: [], rules: {}, verdict: null, rule: "", q: "", id: null, trace: null, tab: "tx", timers: [],
  chat: { messages: [], busy: false, live: [], model: null, remote: false, info: false }, connTimer: null };
const PREFIX = { BK: "bank", EM: "emoney", IV: "investment", PX: "payments_fx" };

async function api(path) {
  const res = await fetch(path);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

/* ---------- queue ---------- */
async function boot() {
  try {
    const { institutions } = await api("/api/institutions");
    $("tabs").innerHTML = institutions.map((n) =>
      `<button class="tab" role="tab" data-inst="${esc(n)}" aria-selected="false">${esc(NAMES[n] || n)}</button>`).join("") +
      `<button class="tab over" id="overBtn" title="Results for this institution's queue">Overview</button>` +
      `<button class="tab over" id="connBtn" title="Connect Grok or another AI agent to the desk">Connect an agent</button>`;
    $("tabs").onclick = (e) => {
      if (e.target.closest("#overBtn")) return showOverview();
      if (e.target.closest("#connBtn")) return showConnect();
      const b = e.target.closest("[data-inst]"); if (b) openInstitution(b.dataset.inst);
    };
    const [h1, h2] = decodeURIComponent(location.hash.slice(1)).split("/");
    await openInstitution(institutions.includes(h1) ? h1 : institutions[0], h2);
  } catch (err) { $("process").innerHTML = `<div class="error">${esc(err.message)}</div>`; }
}

async function openInstitution(name, caseId) {
  state.inst = name; state.verdict = null; state.rule = ""; state.q = ""; $("search").value = "";
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", t.dataset.inst === name));
  $("queue").innerHTML = ""; $("tally").textContent = "Screening every case…";
  const { cases, rules: ruleNames } = await api(`/api/cases?inst=${encodeURIComponent(name)}`);
  state.cases = cases; state.rules = ruleNames || {};
  renderRuleMenu();
  renderFilters(); renderQueue();
  const first = cases.find((c) => c.id === caseId) || visible()[0];
  if (first) openCase(first.id);
}

function visible() {
  const q = state.q.toLowerCase();
  return state.cases.filter((c) =>
    (!state.verdict || c.verdict === state.verdict) && (!state.rule || c.rules.includes(state.rule)) &&
    (!q || (c.id + " " + c.customer + " " + c.reason_code).toLowerCase().includes(q)));
}

function renderFilters() {
  const n = (v) => state.cases.filter((c) => c.verdict === v).length;
  $("filters").innerHTML = VERDICTS.map((v) =>
    `<button class="chip" data-v="${v}" aria-pressed="${state.verdict === v}"><i class="bg-${v}"></i>${v === "RFI" ? "RFI" : v[0] + v.slice(1).toLowerCase()} <b>${n(v)}</b></button>`).join("");
  $("tally").innerHTML = `<b>${state.cases.length.toLocaleString()}</b> cases screened · <b>${n("CLOSE")}</b> closed · <b>${n("RFI")}</b> RFI · <b>${n("ESCALATE")}</b> escalated`;
}

function renderQueue() {
  const rows = visible();
  $("queue").innerHTML = rows.slice(0, 400).map((c) => `
    <li class="q" data-id="${esc(c.id)}" aria-current="${c.id === state.id}" tabindex="0">
      <span class="glyph v-${c.verdict}" title="${c.verdict}">${c.verdict[0]}</span>
      <span><div class="q-name">${esc(c.customer)}</div>
        <div class="q-meta"><span class="mono">${esc(c.id)}</span>${c.rules.map((r) => `<span class="rule-tag" title="${esc(state.rules[r] || r)}">${esc(r)}</span>`).join("")}${c.held ? '<span class="rule-tag" title="An outgoing payment is held until this case is decided">held</span>' : ""}</div></span>
    </li>`).join("");
  $("shown").textContent = rows.length > 400 ? `Showing 400 of ${rows.length}` : `${rows.length} case${rows.length === 1 ? "" : "s"}`;
}

$("filters").onclick = (e) => { const b = e.target.closest("[data-v]"); if (!b) return; state.verdict = state.verdict === b.dataset.v ? null : b.dataset.v; renderFilters(); renderQueue(); };
function renderRuleMenu() {
  const rules = [...new Set(state.cases.flatMap((c) => c.rules))].sort();
  const count = (r) => state.cases.filter((c) => c.rules.includes(r)).length;
  const opt = (value, code, name, n) => `<li class="dd-opt" role="option" data-value="${esc(value)}" aria-selected="${state.rule === value}">
      ${code ? `<span class="dd-code">${esc(code)}</span>` : "<span></span>"}<span>${esc(name)}</span><span class="dd-n">${n.toLocaleString()}</span></li>`;
  $("ruleList").innerHTML = opt("", "", "All rules", state.cases.length) + rules.map((r) => opt(r, r, state.rules[r] || r, count(r))).join("");
  $("ruleText").textContent = state.rule ? `${state.rules[state.rule] || state.rule} (${state.rule})` : "All rules";
}
function ruleMenu(open) {
  $("ruleList").hidden = !open; $("ruleBtn").setAttribute("aria-expanded", open);
  document.querySelectorAll(".dd-opt").forEach((o) => o.classList.toggle("active", open && o.getAttribute("aria-selected") === "true"));
}
function pickRule(value) { state.rule = value; renderRuleMenu(); ruleMenu(false); renderQueue(); $("ruleBtn").focus(); }
$("ruleBtn").onclick = () => ruleMenu($("ruleList").hidden);
$("ruleList").onclick = (e) => { const o = e.target.closest(".dd-opt"); if (o) pickRule(o.dataset.value); };
$("ruleDD").onkeydown = (e) => {
  const opts = [...document.querySelectorAll(".dd-opt")], open = !$("ruleList").hidden;
  let i = opts.findIndex((o) => o.classList.contains("active"));
  if (e.key === "Escape") { ruleMenu(false); $("ruleBtn").focus(); }
  else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (!open) { ruleMenu(true); i = opts.findIndex((o) => o.classList.contains("active")); }
    i = Math.min(opts.length - 1, Math.max(0, i + (e.key === "ArrowDown" ? 1 : -1)));
    opts.forEach((o, k) => o.classList.toggle("active", k === i)); opts[i].scrollIntoView({ block: "nearest" });
  } else if ((e.key === "Enter" || e.key === " ") && open && i >= 0) { e.preventDefault(); pickRule(opts[i].dataset.value); }
  e.stopPropagation();
};
document.addEventListener("click", (e) => { if (!e.target.closest("#ruleDD")) ruleMenu(false); });
$("search").oninput = (e) => { state.q = e.target.value; renderQueue(); };
$("queue").onclick = (e) => { const li = e.target.closest("[data-id]"); if (li) openCase(li.dataset.id); };
$("queue").onkeydown = (e) => { if (e.key === "Enter") { const li = e.target.closest("[data-id]"); if (li) openCase(li.dataset.id); } };
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "r") return state.id ? play() : null;
  if (k !== "j" && k !== "k") return;
  const rows = visible(); const i = rows.findIndex((c) => c.id === state.id);
  const next = rows[Math.min(rows.length - 1, Math.max(0, i + (k === "j" ? 1 : -1)))];
  if (next) openCase(next.id);
});

/* ---------- one case ---------- */
async function openCase(id) {
  state.id = id; history.replaceState(null, "", `#${state.inst}/${id}`);
  document.querySelectorAll(".q").forEach((li) => li.setAttribute("aria-current", li.dataset.id === id));
  document.querySelector(`.q[aria-current="true"]`)?.scrollIntoView({ block: "nearest" });
  try {
    const t = await api(`/api/case?inst=${encodeURIComponent(state.inst)}&id=${encodeURIComponent(id)}`);
    if (state.id !== id) return;
    if (state.tab === "ask" && !state.chat.messages.length && !state.chat.busy) state.tab = "tx";
    state.trace = t; renderProcess(t); renderFile(); play();
  } catch (err) { $("process").innerHTML = `<div class="error">${esc(err.message)}</div>`; }
}

async function runSupervisor(refresh) {
  const id = state.id, box = $("supBody");
  box.innerHTML = `<p class="busy">The supervisor is reading the case…</p>`;
  let r;
  try { r = await api(`/api/supervisor?inst=${encodeURIComponent(state.inst)}&id=${encodeURIComponent(id)}${refresh ? "&refresh=1" : ""}`); }
  catch (err) { r = { error: err.message }; }
  if (state.id !== id || !$("supBody")) return;
  if (r.error) {
    box.innerHTML = `<p><b>${esc(r.error)}</b> ${esc(r.setup || r.detail || "")}</p><button class="btn" id="supRun">Try again</button>`;
    $("supRun").onclick = () => runSupervisor(false); return;
  }
  const ok = r.assessment === "supports_escalation";
  const list = (title, items) => items && items.length ? `<h4>${title}</h4><ul>${items.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  box.innerHTML = `<div><span class="pill ${ok ? "v-ESCALATE" : "v-RFI"}">${ok ? "Grounds hold up" : "Weak grounds: needs a person"}</span>
      <span class="pill" style="color:var(--ink-soft)">confidence ${esc(r.confidence)}</span></div>
    <p class="lead">${esc(r.summary)}</p>
    ${list("Strongest facts", r.strongest_facts)}${list("What the file does not rule out", r.gaps)}${list("Checks to make first, without contacting the customer", r.further_checks)}
    <h4>Draft report narrative</h4><blockquote>${esc(r.sar_narrative)}</blockquote>
    <p class="note" style="margin-top:10px">Written by ${esc(r.model)}. The verdict above was set by the rule engine and is unchanged.
      <button class="btn" id="supAgain" style="margin-left:8px">Ask again</button></p>`;
  $("supAgain").onclick = () => runSupervisor(true);
}

function listEntry(t, a) {
  const id = (a.measured || {}).list_entry, e = t.list_entries.find((x) => x.entry_id === id);
  if (!e) return "";
  return `<div class="entry"><span class="label">What matched, and the list entry it matched</span><dl>
    <dt>Matched on</dt><dd>${esc(a.measured.matched_on)}</dd>
    <dt>Party paid</dt><dd>${esc(a.measured.matched_party)}</dd>
    <dt>List entry</dt><dd><span class="mono">${esc(e.entry_id)}</span> · ${esc(e.name)}${e.date_of_birth ? " · born " + esc(e.date_of_birth) : ""}</dd>
    ${e.address ? `<dt>Listed address</dt><dd>${esc(e.address)}</dd>` : ""}
    <dt>Why listed</dt><dd>${esc(e.reason)}</dd></dl></div>`;
}

function showOverview() {
  stop(); state.id = null; history.replaceState(null, "", `#${state.inst}`);
  document.querySelectorAll(".q").forEach((li) => li.setAttribute("aria-current", "false"));
  const cs = state.cases, n = cs.length, by = (v) => cs.filter((c) => c.verdict === v).length;
  const pct = (x) => (n ? Math.round(1000 * x / n) / 10 : 0);
  const codes = {}; cs.forEach((c) => { const k = c.verdict + "|" + c.reason_code; codes[k] = (codes[k] || 0) + 1; });
  const rules = [...new Set(cs.flatMap((c) => c.rules))].sort();
  const cell = (r, v) => cs.filter((c) => c.rules.includes(r) && c.verdict === v).length;
  const label = { CLOSE: "closed with the evidence cited", RFI: "one named document requested", ESCALATE: "referred to the MLRO" };
  $("process").innerHTML = `<div class="over">
    <div class="case-head"><div><div class="label">${esc(NAMES[state.inst] || state.inst)} · development queue</div>
      <h1>${n.toLocaleString()} cases screened</h1><div class="case-sub">Every case gets a verdict, a reason naming its own documents and amounts, and the evidence relied on. Select a case on the left to replay how it was decided.</div></div></div>
    <div class="over-grid">${VERDICTS.map((v) => `<div class="sheet big v-${v}"><b>${by(v)}</b><span>${pct(by(v))}% · ${label[v]}</span></div>`).join("")}</div>
    <div class="bar">${VERDICTS.map((v) => `<div class="bg-${v}" style="width:${pct(by(v))}%">${v}</div>`).join("")}</div>
    <label class="assume">If a manual review takes <input id="mins" type="number" min="1" max="240" value="15"> minutes, closing ${by("CLOSE")} cases automatically saves <b id="saved"></b></label>
    <h2>Why cases ended the way they did</h2>
    <table><tr><th>Verdict</th><th>Reason code</th><th class="n">Cases</th><th></th></tr>
      ${Object.entries(codes).sort((a, b) => VERDICTS.indexOf(a[0].split("|")[0]) - VERDICTS.indexOf(b[0].split("|")[0]) || b[1] - a[1]).map(([k, c]) => {
        const [v, code] = k.split("|"); return `<tr><td class="v-${v}"><b>${v}</b></td><td class="mono">${esc(code)}</td><td class="n">${c}</td><td><div class="meter"><i class="bg-${v}" style="width:${Math.round(100 * c / Math.max(...Object.values(codes)))}%"></i></div></td></tr>`; }).join("")}</table>
    <h2>Outcome by rule</h2>
    <table><tr><th>Rule</th><th class="n">Cases</th><th class="n">Close</th><th class="n">RFI</th><th class="n">Escalate</th></tr>

function evChips(ids) {
  if (!ids || !ids.length) return "";

function checkCard(c) {
  const word = { explanation: "Explains", suspicion: "Sign of crime", block: "Blocks a close" }[c.outcome];
  const body = c.findings.map((f) => `<p>${esc(f.text)}${/[.!?"]$/.test(f.text) ? "" : "."}</p>
      <span class="code ${f.kind === "suspect" ? "v-ESCALATE" : "v-CLOSE"}">${esc(f.code)}</span>${evChips(f.evidence)}`).join("") +
    c.blocks.map((b) => `<p>${esc(b.fact)}.</p><p><b>Ask for:</b> ${esc(b.ask)}.</p>${evChips([b.tx])}`).join("");
  return `<div class="sheet check ${c.outcome}"><div class="check-top"><h3>${esc(c.title)}</h3><span class="outcome ${c.outcome}">${word}</span></div>
    <div class="check-q">${esc(c.question)}</div>${body}</div>`;
}

function checkGroup(checks, noneText) {
  const hit = checks.filter((c) => c.outcome !== "nothing"), quiet = checks.filter((c) => c.outcome === "nothing");
  return (hit.length ? hit.map(checkCard).join("") : `<div class="sheet check"><div class="check-top"><h3>${esc(noneText)}</h3></div></div>`) +
    (quiet.length ? `<details class="quiet"><summary>${quiet.length} other check${quiet.length === 1 ? "" : "s"} ran and found nothing</summary>
      <ul>${quiet.map((c) => `<li><b>${esc(c.title)}.</b> ${esc(c.question)}</li>`).join("")}</ul></details>` : "");
}

/* ---------- case file ---------- */
function md(text) {
  const out = []; let table = null;
  const flush = () => { if (table) { out.push(`<table>${table.map((r, i) => `<tr>${r.map((c) => `<${i ? "td" : "th"}>${c}</${i ? "td" : "th"}>`).join("")}</tr>`).join("")}</table>`); table = null; } };
  for (const raw of text.split("\n")) {
    if (/^\*\*(Document ID|Dated):\*\*/.test(raw.trim())) continue;
    const line = esc(raw.trim()).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    if (line.startsWith("|")) {
      const cells = line.replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      if (cells.every((c) => /^:?-{2,}:?$/.test(c))) continue;
      (table = table || []).push(cells); continue;
    }
    flush();
    if (!line) continue;
    if (/^#+\s/.test(line)) out.push(`<h4>${line.replace(/^#+\s*/, "")}</h4>`); else out.push(`<p>${line}</p>`);
  }
  flush(); return out.join("");
}

function renderFile() {
  const t = state.trace;
  if (!t) state.tab = "ask";
  const tabs = (t ? [["tx", "Transactions", t.transactions.length], ["docs", "Documents", t.documents.length], ["hist", "History & list", t.reviews.length + t.list_entries.length]] : [])

  if (state.tab === "ask") return renderChat();

  if (state.tab === "tx") {
    const open = new Set(t.alerts.flatMap((a) => a.test.open));
    const row = (x) => `<div class="tx ${x.flagged_by.length ? "flagged" : ""}" id="item-${esc(x.id)}">
        <div class="tx-date">${esc(x.at.slice(0, 10))}<br>${esc(x.at.slice(11))}</div>
        <div><div class="tx-who">${esc(x.counterparty || (x.channel || "").replace(/_/g, " "))}</div>
          <div class="tx-ref">${esc((x.channel || "").replace(/_/g, " "))}${x.reference ? " · " + esc(x.reference) : ""}${x.account ? " · " + esc(x.account) : ""}${x.country && x.country !== "United Kingdom" ? " · " + esc(x.country) : ""}${x.location ? " · " + esc(x.location) : ""}</div>
          <div class="tx-tags"><span class="tag mono">${esc(x.id)}</span>${x.flagged_by.map((r) => `<span class="tag">${esc(r)}</span>`).join("")}
            ${x.held ? '<span class="tag held">held</span>' : ""}${x.explained_by ? `<span class="tag ok">explained · ${esc(x.explained_by)}</span>` : open.has(x.id) ? '<span class="tag open">unexplained</span>' : ""}</div></div>
        <div class="tx-amt ${x.direction}">${x.direction === "in" ? "+" : "−"}${gbp.format(x.amount_gbp)}${x.currency && x.currency !== "GBP" ? `<br><span class="tx-date">${esc(x.currency)} ${Number(x.amount).toLocaleString("en-GB", { minimumFractionDigits: 2 })}</span>` : ""}</div>
      </div>`;
    const cited = new Set(t.decision.evidence.concat(t.checks.flatMap((c) => c.findings.flatMap((f) => f.evidence.concat(f.tx_ids)))));
    const main = t.transactions.filter((x) => x.flagged_by.length || x.held || cited.has(x.id));
    const rest = t.transactions.filter((x) => !main.includes(x));
    html = `<div class="label sub">What the alerts are about · ${main.length}</div>` + main.map(row).join("") +
      (rest.length ? `<div class="label sub">Other transfers of £250 or more in the review window · ${rest.length}</div>` + rest.map(row).join("") : "") +
      `<div class="note">${t.case.transactions_on_file} transactions are on file for this customer in all; card spending and small items are not listed.</div>`;
  } else if (state.tab === "docs") {
    html = t.documents.map((d) => `<details class="doc ${d.relied_on ? "relied" : ""} ${d.baseline ? "baseline" : ""}" id="item-${esc(d.id)}" ${d.relied_on ? "open" : ""}>
        <summary><span><div class="doc-title">${esc(d.title)}</div><div class="doc-meta"><span class="mono">${esc(d.id)}</span> · ${esc(d.type.replace(/_/g, " "))}${d.dated ? " · " + esc(d.dated) : ""}</div></span>
          <span>${d.relied_on ? '<span class="tag" style="border-color:var(--mark);color:var(--mark)">relied on</span>' : ""}</span></summary>
        <div class="doc-body">${md(d.text.replace(/^#.*\n/, ""))}</div></details>`).join("");
  } else {
    html = (t.list_entries.map((e) => `<div class="hist" id="item-${esc(e.entry_id)}"><div class="label">Internal list entry · <span class="mono">${esc(e.entry_id)}</span></div>

      `<div class="note">No earlier reviews and no internal list entry for this case.</div>`;
  }
  $("fileBody").innerHTML = html;
}

/* ---------- assistant: a chat model that works through the MCP tools ---------- */
function chatText(text) {
  const inline = (x) => esc(x).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\b((?:BK|EM|IV|PX)-CS\d+)\b/g, '<a class="case" data-case="$1" title="Open this case">$1</a>');
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`<${list.tag}>${list.items.map((i) => `<li>${i}</li>`).join("")}</${list.tag}>`); list = null; } };
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    const bullet = line.match(/^[-*•]\s+(.*)$/), num = line.match(/^\d+[.)]\s+(.*)$/), head = line.match(/^#{1,4}\s+(.*)$/);
    if (bullet || num) { const tag = bullet ? "ul" : "ol"; if (!list || list.tag !== tag) { close(); list = { tag, items: [] }; } list.items.push(inline((bullet || num)[1])); continue; }
    close();
    if (!line) continue;
    out.push(head ? `<p><b>${inline(head[1])}</b></p>` : `<p>${inline(line)}</p>`);
  }
  close(); return out.join("");
}
const toolLine = (e) => `<div class="${e.done ? "" : "wait"}"><b>${esc(e.name)}</b>${Object.keys(e.arguments || {}).length ? " · " + esc(Object.values(e.arguments).join(" · ")) : ""}${e.done ? " → " + esc(e.summary || "") : ""}</div>`;

function renderChat() {
  const c = state.chat, t = state.trace;
  const sugg = (t ? [`Review case ${t.case.id} as the deputy to the MLRO: do the grounds hold up, and what does the file not rule out?`,
      `Check the verdict on ${t.case.id} against the documents in its file.`] : [])
    .concat([`Which escalated cases in the ${NAMES[state.inst] || state.inst} queue involve the internal list? Show five.`,
      `Summarise the ${NAMES[state.inst] || state.inst} queue for the head of financial crime in five lines.`]);
  const start = `<div class="chat-start"><h3>Ask the desk</h3>
      <div class="sugg">${sugg.map((q) => `<button data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div></div>`;
  const info = c.info ? `<div class="chat-info"><p>Ask in plain English. The assistant answers by calling the desk's tools through the MCP connector, and shows each call it made. It can explain and check a verdict; it cannot change one.</p>
      <p>${c.model === false ? "No model key is set, so the assistant is off. Add one to <code>ui/.env</code> and restart the viewer."
        : c.remote ? `Answers come from Grok (${esc(c.model || "")}). Grok reaches this desk over the internet, through the connector.`
        : `Answers come from ${esc(c.model || "the configured model")}, calling the tools on this machine.`}</p></div>` : "";
  const log = c.messages.map((m) => m.role === "user" ? `<div class="msg user">${esc(m.content)}</div>`
    : m.role === "error" ? `<div class="msg err"><b>${esc(m.content)}</b> ${esc(m.detail || "")}</div>`
    : `<div class="msg bot">${m.tools && m.tools.length ? `<div class="trail">${m.tools.map(toolLine).join("")}</div>` : ""}${chatText(m.content)}</div>`).join("") +
    (c.busy ? `<div class="msg bot"><div class="trail" style="border:0;margin:0;padding:0">${c.live.map(toolLine).join("") || '<div class="wait">Thinking</div>'}</div></div>` : "");
  $("fileBody").innerHTML = `<div class="chat">
      <div class="chat-bar">${c.messages.length ? '<button class="btn" id="chatClear">Clear</button>' : ""}
        <button class="ibtn" id="chatInfo" aria-expanded="${!!c.info}" aria-label="About the assistant" title="About the assistant">i</button></div>
      <div class="chat-log" id="chatLog">${info}${c.messages.length || c.busy ? log : start}</div>
      <form class="chat-box" id="chatForm"><textarea id="chatIn" placeholder="Ask about a case, a customer or the queue" aria-label="Message to the assistant"></textarea>
        <button class="btn" type="submit" ${c.busy ? "disabled" : ""}>Send</button></form></div>`;
  const logEl = $("chatLog"); logEl.scrollTop = logEl.scrollHeight;
  $("chatForm").onsubmit = (e) => { e.preventDefault(); sendChat($("chatIn").value); };
  $("chatIn").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat($("chatIn").value); } };
  if ($("chatClear")) $("chatClear").onclick = () => { c.messages = []; renderChat(); };
  $("chatInfo").onclick = () => { c.info = !c.info; renderChat(); if (c.info) $("chatLog").scrollTop = 0; };
  logEl.onclick = (e) => {
    const q = e.target.closest("[data-q]"); if (q) return sendChat(q.dataset.q);
    const a = e.target.closest("[data-case]"); if (!a) return;
    const id = a.dataset.case, inst = PREFIX[id.slice(0, 2)];
    if (inst && inst !== state.inst) openInstitution(inst, id).then(() => { state.tab = "ask"; renderFile(); }); else openCase(id);
  };
  if (c.model === null) api("/api/llm/status").then((s) => { c.model = s.enabled ? `${s.model} through ${s.provider}` : false; c.remote = !!s.remote; if (state.tab === "ask") renderChat(); }).catch(() => {});
}

async function sendChat(text) {
  const c = state.chat; text = (text || "").trim();
  if (!text || c.busy) return;
  c.messages.push({ role: "user", content: text }); c.busy = true; c.live = [];
  const show = () => { if (state.tab === "ask") renderChat(); };
  show();
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ inst: state.inst, case_id: state.id, messages: c.messages.filter((m) => m.role !== "error").map((m) => ({ role: m.role, content: m.content })) }) });
    if (!res.ok || !res.body) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
    const reader = res.body.getReader(), decoder = new TextDecoder(); let buffer = "", done = false;
    while (!done) {
      const chunk = await reader.read(); done = chunk.done; buffer += decoder.decode(chunk.value || new Uint8Array(), { stream: !done });
      let nl;
      while ((nl = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, nl).trim(); buffer = buffer.slice(nl + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === "tool") c.live.push({ name: ev.name, arguments: ev.arguments });
        else if (ev.type === "tool_result") { const last = [...c.live].reverse().find((x) => x.name === ev.name && !x.done); if (last) { last.done = true; last.summary = ev.summary; } }
        else if (ev.type === "final") c.messages.push({ role: "assistant", content: ev.reply, tools: c.live });
        else if (ev.type === "error") c.messages.push({ role: "error", content: ev.message, detail: ev.detail });
        show();
      }
    }
  } catch (err) { c.messages.push({ role: "error", content: "The assistant could not be reached.", detail: err.message }); }
  c.busy = false; c.live = []; show();
}

function reveal(id) {
  const t = state.trace;
  const tab = t.transactions.some((x) => x.id === id) ? "tx" : t.documents.some((d) => d.id === id) ? "docs" : "hist";
  if (state.tab !== tab) { state.tab = tab; renderFile(); }
  const el = document.getElementById("item-" + id);
  if (!el) return;
  if (el.tagName === "DETAILS") el.open = true;
  el.scrollIntoView({ block: "center", behavior: "smooth" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

addEventListener("hashchange", () => {
  const [inst, id] = decodeURIComponent(location.hash.slice(1)).split("/");
  if (inst && inst !== state.inst) openInstitution(inst, id); else if (id && id !== state.id) openCase(id);
});
boot();
</script>
</body>
